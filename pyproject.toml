[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ambient-chorus"
version = "0.1.0"
description = "Deterministic privacy foundation for Ambient CHORUS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "anyio>=4.11,<5",
  "boto3>=1.40,<2",
  "botocore>=1.40,<2",
  "fastapi>=0.121,<1",
  # Exact, not a range. ADR-018 freezes a sanitizer whose output bytes are hashed and pinned by
  # a golden test, and PNG filter selection and deflate output belong to the encoder build
  # rather than to the format -- so a floating version is a golden hash that changes without a
  # review. It is also the one parser this system points at untrusted bytes.
  "pillow==12.3.0",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "rfc8785>=0.1.4,<0.2",
]

[dependency-groups]
dev = [
  "import-linter>=2.5,<3",
  "mypy>=1.18,<2",
  "pip-licenses>=5,<6",
  "ruff>=0.14,<1",
]
test = [
  "httpx>=0.28,<0.29",
  "hypothesis>=6.140,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=7,<8",
]
agents = [
  # Only the Monitor/Investigator/Action runtime artifacts import Strands. It is a separate
  # group so an application or Lambda artifact never ships the agent SDK, and so
  # import-linter keeps proving that no `chorus` package imports it.
  "strands-agents>=1.10,<2",
]
infra = [
  "aws-cdk-lib>=2.220,<3",
  "constructs>=10.4,<11",
]

[tool.uv]
default-groups = ["agents", "dev", "test", "infra"]
cache-dir = ".tools/uv-cache"

[tool.hatch.build.targets.wheel]
# The editable development install carries the API and the agent runtimes as well as the
# library, so import-linter and mypy can see every package the boundary contracts name.
# Deployment artifacts are built separately from an explicit per-runtime file allowlist, so
# nothing here decides what ships to an agent runtime or a Lambda.
packages = ["src/chorus", "apps/api/chorus_api", "runtimes", "functions"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --showlocals"
cache_dir = "build/pytest-cache"
testpaths = ["tests"]
pythonpath = [".", "apps/api"]
markers = [
  "live_agent: gated evaluation that invokes a real Bedrock/AgentCore Monitor runtime",
]
xfail_strict = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "infra", "tools"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "apps/api"]
plugins = ["pydantic.mypy"]
exclude = ["^cdk.out/", "^node_modules/"]

[[tool.mypy.overrides]]
module = ["rfc8785", "boto3", "botocore.*", "strands", "strands.*"]
ignore_missing_imports = true

[tool.importlinter]
root_packages = ["chorus", "chorus_api", "runtimes", "functions"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain depends only on the standard library"
type = "forbidden"
source_modules = ["chorus.domain"]
forbidden_modules = [
  "pydantic",
  "pydantic_settings",
  "fastapi",
  "boto3",
  "botocore",
  "strands",
  "aws_cdk",
  "chorus.privacy",
  "chorus.ports",
  "chorus.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Ports declare no framework or SDK type of their own"
type = "forbidden"
source_modules = ["chorus.ports"]
# Direct imports only. A port may name a `chorus.contracts` boundary DTO -- the frozen
# dependency table allows exactly that -- and those DTOs are Pydantic models, so an indirect
# Pydantic edge is expected. What must never happen is a port module declaring its own
# Pydantic model or reaching for an SDK, which is what a direct import would mean.
allow_indirect_imports = true
forbidden_modules = [
  "pydantic",
  "pydantic_settings",
  "fastapi",
  "boto3",
  "botocore",
  "strands",
  "aws_cdk",
]

[[tool.importlinter.contracts]]
name = "Ports never depend on the privacy compiler or infrastructure"
type = "forbidden"
source_modules = ["chorus.ports"]
forbidden_modules = [
  "chorus.privacy",
  "chorus.infrastructure",
  "chorus.application",
  "chorus_api",
]

[[tool.importlinter.contracts]]
name = "Agent contracts are boundary DTOs without persistence or application code"
type = "forbidden"
source_modules = ["chorus.contracts"]
forbidden_modules = [
  "fastapi",
  "boto3",
  "botocore",
  "strands",
  "aws_cdk",
  "chorus.ports",
  "chorus.privacy",
  "chorus.application",
  "chorus.infrastructure",
  "chorus_api",
]

[[tool.importlinter.contracts]]
name = "Application coordinates ports without SDKs or a web framework"
type = "forbidden"
source_modules = ["chorus.application"]
allow_indirect_imports = true
forbidden_modules = [
  "fastapi",
  "boto3",
  "botocore",
  "strands",
  "aws_cdk",
  "chorus.infrastructure",
  "chorus_api",
]

[[tool.importlinter.contracts]]
name = "API routes hold no persistence, policy, or agent SDK code"
type = "forbidden"
source_modules = ["chorus_api"]
allow_indirect_imports = true
forbidden_modules = [
  "boto3",
  "botocore",
  "strands",
  "aws_cdk",
  "chorus.privacy",
]

[[tool.importlinter.contracts]]
name = "The Monitor runtime imports only its own public contract"
type = "forbidden"
source_modules = ["runtimes.monitor"]
# `chorus.domain` is deliberately absent. The Monitor contract reuses the frozen domain enums
# -- fact types, sensitivity categories, failure modes -- and that module imports nothing but
# the standard library, so reaching them through the contract adds no capability. The Action
# runtime, whose isolation is the strict case, forbids `domain` outright when it is built.
#
# One exception is granted, and only one: `botocore.config`. The runtime must pin its Bedrock
# client to a single attempt, or the SDK retries a throttle six times underneath the single
# retry the application believes it owns. Strands accepts that setting only as a
# `botocore.config.Config`, which constructs no client, holds no credential, and reaches no
# service. A unit test asserts that no other `boto3` or `botocore` module appears in the
# runtime source.
# The lazy, function-level import is not always visible in the import graph, so the ignore is
# declared without alerting: it must not become a CI failure either way, and the unit test is
# the gate that actually holds.
ignore_imports = ["runtimes.monitor.agent -> botocore"]
unmatched_ignore_imports_alerting = "none"
forbidden_modules = [
  "boto3",
  "botocore",
  "fastapi",
  "aws_cdk",
  "chorus.privacy",
  "chorus.ports",
  "chorus.application",
  "chorus.infrastructure",
  "chorus_api",
]

[[tool.importlinter.contracts]]
name = "The Investigator runtime imports only its own public contract"
type = "forbidden"
source_modules = ["runtimes.investigator"]
# `chorus.domain` is deliberately absent for the same reason it is for the Monitor: the
# investigation contract reuses the frozen domain enums -- fact types, sensitivity categories,
# case states, contradiction materiality -- and that module imports nothing but the standard
# library, so reaching them through the contract adds no capability.
#
# The same single `botocore.config` exception applies: the runtime must pin its Bedrock client
# to one attempt, Strands accepts that only as a `botocore.config.Config`, and that object
# constructs no client, holds no credential, and reaches no service. A unit test asserts that
# no other `boto3` or `botocore` module appears in the runtime source.
ignore_imports = ["runtimes.investigator.agent -> botocore"]
unmatched_ignore_imports_alerting = "none"
forbidden_modules = [
  "boto3",
  "botocore",
  "fastapi",
  "aws_cdk",
  "chorus.privacy",
  "chorus.ports",
  "chorus.application",
  "chorus.infrastructure",
  "chorus_api",
]

[[tool.importlinter.contracts]]
name = "Infrastructure implements ports without reaching into the privacy compiler"
type = "forbidden"
source_modules = ["chorus.infrastructure"]
forbidden_modules = [
  "fastapi",
  "strands",
  "aws_cdk",
  "chorus.privacy",
  "chorus.application",
  "chorus_api",
]

[[tool.importlinter.contracts]]
name = "Privacy stays deterministic and infrastructure free"
type = "forbidden"
source_modules = ["chorus.privacy"]
forbidden_modules = [
  "pydantic",
  "pydantic_settings",
  "fastapi",
  "boto3",
  "botocore",
  "strands",
  "aws_cdk",
  "chorus.ports",
  "chorus.infrastructure",
]

[[tool.importlinter.contracts]]
name = "The compiler function composes adapters and never a model or a transport"
type = "forbidden"
source_modules = ["functions.compiler"]
# A composition root is allowed to see infrastructure -- that is what it composes -- so this
# contract names what it must never reach instead. Strands and the agent contracts are both
# forbidden for the same reason: the compiler is where policy stops being probabilistic, and an
# import is the first step back toward a model having an opinion about disclosure.
forbidden_modules = [
  "strands",
  "aws_cdk",
  "chorus.contracts",
  "chorus_api",
  "runtimes",
]
