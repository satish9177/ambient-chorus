name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests infra tools
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run python tools/check_architecture_links.py
      - run: uv run python tools/check_secrets.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run e2e:list
      - run: npm run cdk:synth

