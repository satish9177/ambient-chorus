name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      dynamodb-local:
        # The persistence contract suite runs against a real DynamoDB endpoint; without
        # this service the integration half of every contract test would silently skip.
        image: amazon/dynamodb-local:2.6.1
        ports:
          - 8000:8000
    env:
      CHORUS_REQUIRE_DYNAMODB_LOCAL: "1"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --frozen
      - run: npm ci
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests infra tools apps/api runtimes
      - run: uv run lint-imports
      - run: uv run pytest
      - run: uv run python tools/check_architecture_links.py
      - run: uv run python tools/check_license.py
      - run: uv run python tools/check_secrets.py
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run e2e:list
      - run: npm run cdk:synth
