# Deployment manifest for the Action AgentCore direct-code runtime.
#
# This declares what the artifact *is*: which files it ships, which module answers an
# invocation, which dependencies it needs, and which capabilities it must not have. It is read
# by the artifact build and asserted by `tests/unit/tooling/test_action_boundaries.py`, so a
# file that quietly acquires an import the artifact may not contain fails before deployment
# rather than after it.
#
# The runtime resource itself is created later in Phase 11, because the frozen network design
# puts it in two isolated VPC subnets with no NAT route and that VPC belongs to the deployment
# stack. The HTTP binding that hands a request body to `handle` now exists: see
# `root_entrypoint` and `server_binding` below.

[runtime]
name = "chorus-action"
deployed_name = "chorus_action"
# The AgentCore runtime resource name. Runtime names match
# `^[a-zA-Z][a-zA-Z0-9_]{0,47}$` -- letters, digits, and underscore only -- so the
# hyphenated `name` above cannot be one. The IAM role and log group keep their hyphens;
# the constraint is on the runtime resource alone. Declared here rather than derived, so
# the mapping is a fact the deployment reads instead of a transformation it performs.
agent_name = "ACTION"
prompt_version = "action/v1"
python_version = "3.12"
network_mode = "VPC"

[entrypoint]
module = "runtimes.action.entrypoint"
callable = "handle"
signature = "async (raw: bytes) -> bytes"
# `handle` takes the raw request body and returns the raw response body. It reads no
# environment beyond the two variables below, holds no state between calls, and constructs a
# fresh agent per invocation, so a server shim around it is a transport adapter and nothing
# more.

[artifact]
root_entrypoint = "runtimes/action/main.py"
# Copied to the archive **root** as `main.py`, which is where AgentCore looks for the file its
# entrypoint command names. It is not in `include` because it ships once, at the root, rather
# than twice; everything in `include` keeps its repo-relative path so `runtimes.action` and
# `chorus.contracts` resolve inside the unpacked zip exactly as they do in the repository.
include = [
  "runtimes/__init__.py",
  "runtimes/bootstrap.py",
  "runtimes/server.py",
  "runtimes/action/__init__.py",
  "runtimes/action/agent.py",
  "runtimes/action/entrypoint.py",
  "runtimes/action/prompt.py",
  "src/chorus/__init__.py",
  "src/chorus/contracts/__init__.py",
  "src/chorus/contracts/action.py",
  "src/chorus/contracts/common.py",
]
# The strictest allowlist of the three, and the reason it is strict is the reason the Action
# contract restates the view instead of importing it. The Monitor and Investigator artifacts
# carry `chorus/domain` because their contracts reuse the frozen domain enums; this one does
# **not**, so `chorus.domain`, `chorus.privacy`, `chorus.ports`, `chorus.application`,
# `chorus.infrastructure`, and the other two agent contracts are all absent from the zip. The
# Action runtime is the one that writes text for somebody outside the community, and what it
# can import is what decides how much it could ever say.
#
# `contracts/common.py` is present because it owns the shared envelope and the strict model
# base. It imports only pydantic and the standard library.

[dependencies]
# The minimal subset the artifact actually imports. Exact resolved versions live in `uv.lock`;
# the ranges here are the contract, not a second source of truth for versions.
required = [
  "strands-agents>=1.10,<2",
  "pydantic>=2.9,<3",
  "botocore>=1.35,<2",
  # The HTTP binding. Already inside the closure above -- `strands-agents` reaches it through
  # `mcp` and `sse-starlette` -- and named here because `main.py` now imports it directly, and a
  # transitive dependency that becomes a direct one is exactly the kind of fact this list exists
  # to state.
  "uvicorn>=0.34,<1",
]

[packaging]
target_platform = "aarch64-manylinux2014"
target_python = "3.12"
only_binary = true
# The build runs on Windows and the runtime runs on Linux/ARM64, so dependencies are resolved
# for an explicit target rather than for the host. `only_binary` is true because a source
# distribution would be compiled for the *build* machine: a zip that silently vendored Windows
# or x86_64 wheels produces a runtime that fails at import with no useful message.
#
# Versions come from `uv.lock` and from nowhere else. The build exports the locked `agents`
# group and installs exactly that, so the artifact's dependency set is decided by the lockfile
# rather than by whatever resolved on the day it was packaged.

[capabilities]
tools = false
memory = false
gateway = false
code_interpreter = false
browser = false
filesystem_persistence = false
session_reuse = false
outbound_internet = false
repositories = false
# Every one of these is false because the frozen agent architecture says so. `repositories` is
# listed explicitly even though no runtime has any: the Action agent is the one a reader might
# expect to need a lookup -- to resolve a recipient, to check a fact, to read a case -- and
# stating the answer here is cheaper than leaving it to be inferred from an absence.

[limits]
max_payload_bytes = 1048576
max_output_tokens = 3000
temperature = 0.0
max_model_attempts = 1
model_read_timeout_seconds = 45
runtime_budget_seconds = 60
# `max_model_attempts` is one because the application owns the single licensed agent retry.
# The two timeouts are the inner two rungs of the hierarchy; the outer rung is the
# application's `CHORUS_AGENT_TIMEOUT_SECONDS`, which must be larger than both.

[phase_11]
server_binding = "IMPLEMENTED"
# The gap is closed. `runtimes/action/main.py` is the direct-code entrypoint AgentCore runs; it
# builds one `runtimes.server.AgentCoreServer` around this runtime's `handle` and serves it on
# `0.0.0.0:8080` with `GET /ping` and `POST /invocations` and nothing else.
#
# A bare ASGI application rather than the `bedrock-agentcore` server SDK, because the smallest
# correct binding is the one that adds no package to the archive: `uvicorn` is already inside
# this artifact's locked dependency closure by way of `strands-agents -> mcp -> sse-starlette`,
# so the whole transport costs fifty lines and zero wheels. The SDK would add a dependency to
# dispatch two fixed paths, and a web framework would add a router and an injection system to
# do the same.
#
# `handle` remains the only entry point. The server holds no contract, no schema, and no branch
# on payload content, so every existing boundary test still covers the deployed path.
live_evaluation = "NOT_RUN"
# The gated scenarios in `tests/evaluation/test_live_action.py` have never been run against a
# real model.
